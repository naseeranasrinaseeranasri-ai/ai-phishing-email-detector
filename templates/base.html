<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Phishing Email Detector{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('main.index') }}">Phishing Email Detector</a>
    <nav>
      <a href="{{ url_for('main.index') }}">Analyze</a>
      <a href="{{ url_for('main.history') }}">History</a>
    </nav>
  </header>

  <main class="sheet">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    Runs on your computer. Links are never opened. Results are advisory only.
  </footer>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
